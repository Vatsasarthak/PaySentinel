spring:
  application:
    name: paysentinel

  jackson:
    deserialization:
      # Amounts are integers in minor units (paise). Reject fractional JSON numbers such as 50.75 with
      # 400 instead of silently truncating them to 50 (Jackson's default).
      accept-float-as-int: false

  # Local development convenience: values from ./.env (KEY=value lines) become resolvable
  # placeholders. The file is optional and must never be committed.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:${POSTGRES_USER:payment_user}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true

info:
  app:
    name: PaySentinel
    description: "Reliable Payout Processing & Ledger Reconciliation (simulated payment provider)"
    version: 1.0.0

payout:
  # Must be set explicitly. "local" permits development-only features (dev profile, seeding, loggers
  # endpoint); "production" refuses them and every safety-reducing setting; anything else (or unset)
  # refuses development-only features.
  environment: ${APP_ENVIRONMENT:}
  supported-currencies: INR
  scheduling:
    enabled: true
    pool-size: 4
  relay:
    interval-ms: 1000
    batch-size: 100
    lock-at-most-for: PT1M
  worker:
    poll-interval-ms: 200
    batch-size: 20
    concurrency: 16
    lease-duration: PT60S
    max-delivery-attempts: 5
  queue:
    visibility-timeout: PT2M
    recovery-scan-limit: 500
  recovery:
    interval-ms: 30000
    initial-delay-ms: 10000
    lock-at-most-for: PT5M
    reconciliation-interval-ms: 300000
    stuck-payout-timeout: PT10M
    batch-size: 100
  gateway:
    success-percent: 70
    failure-percent: 20
    processed-before-timeout-percent: 50
    max-attempts: 3
    backoff-delay-ms: 2000
    backoff-multiplier: 2
  ledger:
    seed-enabled: false
    redis-import-enabled: ${LEDGER_REDIS_IMPORT_ENABLED:true}
    fail-on-unmigrated-legacy-data: true
  funding:
    # Dual control: adjustments post only after a second, different treasury key approves them.
    require-approval: true
  security:
    # One client is configurable through environment variables. For several clients, provide the
    # whole payout.security.clients list in an extra config file (SPRING_CONFIG_ADDITIONAL_LOCATION);
    # lists are replaced, not merged, across configuration sources.
    clients:
      - name: ${APP_CLIENT_NAME:default-client}
        api-key: ${APP_CLIENT_API_KEY:}
        api-key-sha256: ${APP_CLIENT_API_KEY_SHA256:}
        accounts: ${APP_CLIENT_ACCOUNTS:}
    admin:
      api-key: ${APP_ADMIN_API_KEY:}
      api-key-sha256: ${APP_ADMIN_API_KEY_SHA256:}
      accounts: ${APP_ADMIN_ACCOUNTS:}
      read-all-payouts: ${APP_ADMIN_READ_ALL_PAYOUTS:false}
    # Treasury keys move money (funding adjustments, manual-review resolutions). Slots without a key
    # are ignored, so treasury is disabled unless keys are provided. Dual control needs two keys.
    treasury:
      - name: ${APP_TREASURY_1_NAME:treasury-1}
        api-key: ${APP_TREASURY_1_API_KEY:}
        api-key-sha256: ${APP_TREASURY_1_API_KEY_SHA256:}
        accounts: ${APP_TREASURY_1_ACCOUNTS:}
        all-accounts: ${APP_TREASURY_1_ALL_ACCOUNTS:false}
      - name: ${APP_TREASURY_2_NAME:treasury-2}
        api-key: ${APP_TREASURY_2_API_KEY:}
        api-key-sha256: ${APP_TREASURY_2_API_KEY_SHA256:}
        accounts: ${APP_TREASURY_2_ACCOUNTS:}
        all-accounts: ${APP_TREASURY_2_ALL_ACCOUNTS:false}
  rate-limit:
    enabled: true
    fail-open: true
    create:
      capacity: 50
      refill-per-second: 20
    read:
      capacity: 200
      refill-per-second: 100
    admin:
      capacity: 30
      refill-per-second: 10
    auth-failure:
      capacity: 20
      refill-per-second: 1
