
# Local development stack. Credentials come from .env (see .env.example).
#   docker compose up -d
#   docker compose --profile app up -d --build

services:
  postgres:
    # Pinned by digest (registry index digest for postgres:16, verified 2026-10-10); Dependabot updates it.
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    container_name: payment_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payment_db}
      POSTGRES_USER: ${POSTGRES_USER:-payment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # Pinned by digest (registry index digest for redis:7-alpine, verified 2026-10-10); Dependabot updates it.
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: payment_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: >
      sh -c 'umask 077 && printf "requirepass %s\n" "$$REDIS_PASSWORD" > /tmp/redis-auth.conf
      && exec redis-server /tmp/redis-auth.conf --appendonly yes --appendfsync always
      --maxmemory-policy noeviction
      --rename-command FLUSHALL "" --rename-command FLUSHDB "" --rename-command DEBUG ""
      --rename-command KEYS ""'
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build: .
    image: paysentinel:local
    container_name: payment_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payment_db}
      DB_USERNAME: ${POSTGRES_USER:-payment_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      APP_CLIENT_NAME: ${APP_CLIENT_NAME:-default-client}
      APP_CLIENT_API_KEY: ${APP_CLIENT_API_KEY:-}
      APP_CLIENT_API_KEY_SHA256: ${APP_CLIENT_API_KEY_SHA256:-}
      APP_CLIENT_ACCOUNTS: ${APP_CLIENT_ACCOUNTS:?Set APP_CLIENT_ACCOUNTS in .env}

      APP_ADMIN_API_KEY: ${APP_ADMIN_API_KEY:-}
      APP_ADMIN_API_KEY_SHA256: ${APP_ADMIN_API_KEY_SHA256:-}
      APP_ADMIN_ACCOUNTS: ${APP_ADMIN_ACCOUNTS:-}
      APP_ADMIN_READ_ALL_PAYOUTS: ${APP_ADMIN_READ_ALL_PAYOUTS:-false}

      APP_TREASURY_1_NAME: ${APP_TREASURY_1_NAME:-treasury-1}
      APP_TREASURY_1_API_KEY: ${APP_TREASURY_1_API_KEY:-}
      APP_TREASURY_1_API_KEY_SHA256: ${APP_TREASURY_1_API_KEY_SHA256:-}
      APP_TREASURY_1_ACCOUNTS: ${APP_TREASURY_1_ACCOUNTS:-}
      APP_TREASURY_1_ALL_ACCOUNTS: ${APP_TREASURY_1_ALL_ACCOUNTS:-false}

      APP_TREASURY_2_NAME: ${APP_TREASURY_2_NAME:-treasury-2}
      APP_TREASURY_2_API_KEY: ${APP_TREASURY_2_API_KEY:-}
      APP_TREASURY_2_API_KEY_SHA256: ${APP_TREASURY_2_API_KEY_SHA256:-}
      APP_TREASURY_2_ACCOUNTS: ${APP_TREASURY_2_ACCOUNTS:-}
      APP_TREASURY_2_ALL_ACCOUNTS: ${APP_TREASURY_2_ALL_ACCOUNTS:-false}

      # No default: development features (SPRING_PROFILES_ACTIVE=dev) require APP_ENVIRONMENT=local.
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      LEDGER_REDIS_IMPORT_ENABLED: ${LEDGER_REDIS_IMPORT_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}

    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
